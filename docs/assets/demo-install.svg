<svg xmlns="http://www.w3.org/2000/svg" width="758" height="456" viewBox="0 0 758 456" role="img" aria-label="dressrun rehearsing a third-party installer">
  <title>dressrun rehearsing a third-party installer</title>
  <rect width="758" height="456" rx="10" fill="#0d1117"/>
  <rect width="758" height="36" rx="10" fill="#161b22"/>
  <rect y="26" width="758" height="10" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/><circle cx="42" cy="18" r="6" fill="#ffbd2e"/><circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">
    <text x="28" y="64" xml:space="preserve"><tspan fill="#8b949e">$</tspan><tspan fill="#e6edf3"> dressrun -c "sh ./install-acme.sh"</tspan></text>
    <text x="28" y="84" xml:space="preserve"></text>
    <text x="28" y="104" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">dressrun</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#79c0ff">sh ./install-acme.sh</tspan></text>
    <text x="28" y="124" xml:space="preserve"><tspan fill="#8b949e">rehearsal 20261004032917-cdb0 · </tspan><tspan fill="#7ee787">exit 0</tspan><tspan fill="#8b949e"> · 14ms</tspan></text>
    <text x="28" y="144" xml:space="preserve"></text>
    <text x="28" y="164" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">PROJECT</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">~/code/acme-cli</tspan></text>
    <text x="28" y="184" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e"> 1 </tspan><tspan fill="#7ee787">+</tspan><tspan fill="#e6edf3"> .acmerc.json       </tspan><tspan fill="#8b949e">+1</tspan></text>
    <text x="28" y="204" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e"> 2 </tspan><tspan fill="#7ee787">+</tspan><tspan fill="#e6edf3"> .husky/pre-commit  </tspan><tspan fill="#8b949e">+2</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72">! git hook</tspan></text>
    <text x="28" y="224" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e"> 3 </tspan><tspan fill="#e3b341">~</tspan><tspan fill="#e6edf3"> package.json       </tspan><tspan fill="#8b949e">+2 -1</tspan></text>
    <text x="28" y="244" xml:space="preserve"></text>
    <text x="28" y="264" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">HOME</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">fake ~ for this run; your real home is untouched</tspan></text>
    <text x="28" y="284" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">+</tspan><tspan fill="#e6edf3"> ~/.acme/bin/acme                               </tspan><tspan fill="#8b949e">+2, executable</tspan></text>
    <text x="28" y="304" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">~</tspan><tspan fill="#e6edf3"> ~/.zshrc                                       </tspan><tspan fill="#8b949e">+3 -0</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72">! shell startup file</tspan></text>
    <text x="28" y="324" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#7ee787">+</tspan><tspan fill="#e6edf3"> ~/Library/LaunchAgents/dev.acme.updater.plist  </tspan><tspan fill="#8b949e">+6</tspan><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72">! runs at login</tspan></text>
    <text x="28" y="344" xml:space="preserve"></text>
    <text x="28" y="364" xml:space="preserve"><tspan fill="#8b949e">3 project files changed · 3 home files written</tspan><tspan fill="#ff7b72"> · 3 flagged</tspan></text>
    <text x="28" y="384" xml:space="preserve"></text>
    <text x="28" y="404" xml:space="preserve"><tspan fill="#8b949e">[a]pply project · apply [h]ome too · [d]iff · [s]elect · [k]eep · [n] discard</tspan></text>
    <text x="28" y="424" xml:space="preserve"><tspan fill="#e6edf3">&gt; </tspan></text>
  </g>
</svg>
